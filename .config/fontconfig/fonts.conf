<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Requires: noto-fonts noto-fonts-emoji ttf-jetbrains-mono-nerd -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans Math</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans Math</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans Math</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Explicit requests for the nerd font fall back through monospace, not sans-serif -->
  <alias>
    <family>JetBrainsMono Nerd Font</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
</fontconfig>
